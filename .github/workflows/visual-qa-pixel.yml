name: QA visual rediseño pixel
on:
  push:
    branches:
      - redisenio-pixel-cartas-2026-10-21
  workflow_dispatch:
jobs:
  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright-core@1.58.2
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/ligasaber-http.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8765/index.html > /dev/null
      - run: node qa-pixel.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-redisenio-pixel
          path: qa-screenshots/
          if-no-files-found: warn
          retention-days: 30