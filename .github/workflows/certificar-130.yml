name: Certificación individual de 130 actividades
on:
  push:
    branches:
      - test/certificacion-130-actividades
      - test/integracion-b-130
  workflow_dispatch:
permissions:
  contents: read
jobs:
  banco-y-regresion:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar banco y reglas existentes
        run: |
          node --check juego.js
          node --check minijuegos.js
          node --check preguntas-drive.js
          node --check tests/certificar-130-browser.cjs
          node tests/contenidos-drive.cjs
          node tests/fases-secuenciales.cjs
      - name: Preparar navegador
        run: npm install --no-save playwright-core@1.58.2
      - name: Iniciar servidor local
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/liga-130-regression.log 2>&1 &
          sleep 1
      - name: Progreso y recuperación
        run: node tests/guardar-y-bloquear.cjs
      - name: Prueba completa de minijuegos y cartas
        run: node tests/smoke-pixel.cjs
      - name: Preguntas de ambas asignaturas
        run: node tests/contenidos-drive-browser.cjs
      - name: PWA y mapa visual
        run: node qa-pixel.js
  fases-y-pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar navegador
        run: npm install --no-save playwright-core@1.58.2
      - name: Servidor de pruebas aislado
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/liga-30-fases.log 2>&1 &
          sleep 1
      - name: Ejecutar treinta fases y recompensas únicas
        run: node tests/certificar-30-fases.cjs
      - name: Verificar PWA realmente desconectada
        run: node tests/certificar-offline-pwa.cjs
      - name: Publicar evidencias de fases y PWA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certificacion-fases-y-pwa
          path: qa-certificacion/
          if-no-files-found: warn
  actividad-individual:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      CERT_SHARDS: 8
      CERT_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright Core
        run: npm install --no-save playwright-core@1.58.2
      - name: Servidor HTTP aislado
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/liga-130-http.log 2>&1 &
          sleep 1
      - name: Ejecutar cada actividad, ambos resultados, pistas y recargas
        run: node tests/certificar-130-browser.cjs
      - name: Subir matriz y capturas de este grupo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certificacion-130-shard-${{ matrix.shard }}
          path: qa-certificacion/
          if-no-files-found: warn
  matriz-final:
    runs-on: ubuntu-latest
    if: always()
    needs: [banco-y-regresion, actividad-individual, fases-y-pwa]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: certificacion-130-shard-*
          path: qa-certificacion/grupos
          merge-multiple: false
      - name: Rechazar certificación incompleta
        run: node tests/informe-certificacion-130.cjs
      - name: Publicar matriz de certificación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-final-certificacion-130
          path: qa-certificacion/
          if-no-files-found: warn
