name: Capturas rápidas arte v7
on:
  push:
    branches:
      - alta-fidelidad-fantasia-v7-2026-10-23
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright-core@1.58.2
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/v7-preview.log 2>&1 &
          sleep 2
      - run: node tools/preview-v7.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-grafica-v7
          path: preview-v7/
          retention-days: 10
      - run: |
          git archive -o /tmp/codigo-v7.zip HEAD
          mkdir -p archive
          cp /tmp/codigo-v7.zip archive/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codigo-v7
          path: archive/
          retention-days: 5
